name: Build Windows EXE & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 1. BUILD WEB ASSETS (Fast, Platform-Independent on Linux)
  # ------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # ------------------------------------------------------------
  # 2. BUILD WINDOWS .EXE INSTALLER (Using Pre-built Web Assets)
  # ------------------------------------------------------------
  build-windows-exe:
    needs: build-web
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install Packaging Dependencies
        run: npm install --legacy-peer-deps

      - name: Package Windows EXE with Electron Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --config electron-builder.json --publish never

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-Windows-EXE
          path: dist-electron/*.exe
          if-no-files-found: warn

  # ------------------------------------------------------------
  # 3. BUILD ANDROID .APK PACKAGE (Using Java 21 for Capacitor 7)
  # ------------------------------------------------------------
  build-android-apk:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Required for Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Capacitor & Android Project
        run: |
          # If gradlew is missing or android directory is incomplete, re-add clean Android platform
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew not found in android directory. Cleaning and re-adding Android platform..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          # Ensure cleartext network permissions and camera permissions are present in AndroidManifest
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml || sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.CAMERA" \/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml 2>/dev/null || true

          # Ensure MainActivity has WindowCompat.setDecorFitsSystemWindows so status bar icons never overlap UI
          mkdir -p android/app/src/main/java/com/syncwave/ai
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/java/com/syncwave/ai/MainActivity.java";
            const code = "package com.syncwave.ai;\n\nimport android.os.Bundle;\nimport androidx.core.view.WindowCompat;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        WindowCompat.setDecorFitsSystemWindows(getWindow(), true);\n    }\n}\n";
            fs.writeFileSync(file, code);
          '


      - name: Build Debug APK via Gradle
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif command -v gradle &> /dev/null; then
            echo "gradlew missing, assembling debug APK with system Gradle..."
            gradle assembleDebug --no-daemon --stacktrace
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # ------------------------------------------------------------
  # 4. CREATE GITHUB RELEASE WITH DIRECT DOWNLOADS
  # ------------------------------------------------------------
  publish-release:
    needs: [build-windows-exe, build-android-apk]
    if: always() && (needs.build-windows-exe.result == 'success' || needs.build-android-apk.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Assets Directory
        run: mkdir -p release-assets

      - name: Download Windows EXE (if built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SyncWave-Windows-EXE
          path: release-assets/

      - name: Download Android APK (if built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SyncWave-Android-APK
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SyncWave Studio v1.0.${{ github.run_number }} (EXE & APK)
          body: |
            ## SyncWave Studio Binary Downloads ⚡
            - **Windows**: `SyncWave-Studio-Setup.exe` (Windows desktop standalone installer)
            - **Android**: `app-debug.apk` (Android mobile APK)
            - Real-time synchronization active across devices using NVIDIA NIM API.
          files: |
            release-assets/**/*.exe
            release-assets/**/*.apk
