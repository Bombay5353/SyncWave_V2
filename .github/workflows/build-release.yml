name: Build Windows EXE & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 1. BUILD WINDOWS .EXE INSTALLER
  # ------------------------------------------------------------
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Package Windows EXE with Electron Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --config electron-builder.json --publish never

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-Windows-EXE
          path: dist-electron/*.exe
          if-no-files-found: warn

  # ------------------------------------------------------------
  # 2. BUILD ANDROID .APK PACKAGE (Java 21 for Capacitor 7)
  # ------------------------------------------------------------
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Required for Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets & Sync Android
        run: |
          npm run build
          if [ ! -f "android/gradlew" ]; then
            echo "Regenerating Android platform..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Build Debug APK via Gradle
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          elif command -v gradle &> /dev/null; then
            gradle assembleDebug --no-daemon
          else
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # ------------------------------------------------------------
  # 3. CREATE GITHUB RELEASE WITH DIRECT DOWNLOADS
  # ------------------------------------------------------------
  publish-release:
    needs: [build-windows-exe, build-android-apk]
    if: always() && (needs.build-windows-exe.result == 'success' || needs.build-android-apk.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Assets Directory
        run: mkdir -p release-assets

      - name: Download Windows EXE (if built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SyncWave-Windows-EXE
          path: release-assets/

      - name: Download Android APK (if built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SyncWave-Android-APK
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SyncWave Studio v1.0.${{ github.run_number }} (EXE & APK)
          body: |
            ## SyncWave Studio Binary Downloads ⚡
            - **Windows**: `SyncWave Studio Setup.exe` (Windows desktop standalone installer)
            - **Android**: `app-debug.apk` (Android mobile APK)
            - Real-time synchronization active across devices using NVIDIA NIM API.
          files: |
            release-assets/**/*.exe
            release-assets/**/*.apk
