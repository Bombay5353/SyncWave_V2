name: Build Windows EXE & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 1. BUILD WINDOWS .EXE INSTALLER
  # ------------------------------------------------------------
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron Tooling
        run: npm install --legacy-peer-deps electron@latest electron-builder@latest

      - name: Build Web Production Bundle
        run: npm run build

      - name: Package Windows EXE
        run: |
          npx electron-builder --win --x64 -c.extraMetadata.main=electron/main.cjs -c.appId=com.syncwave.ai -c.productName="SyncWave Studio"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-Windows-EXE
          path: dist/*.exe
          if-no-files-found: warn

  # ------------------------------------------------------------
  # 2. BUILD ANDROID .APK PACKAGE
  # ------------------------------------------------------------
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Capacitor & Android Project
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # ------------------------------------------------------------
  # 3. CREATE GITHUB RELEASE WITH DIRECT DOWNLOADS
  # ------------------------------------------------------------
  publish-release:
    needs: [build-windows-exe, build-android-apk]
    if: always() && (needs.build-windows-exe.result == 'success' || needs.build-android-apk.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Create release-assets Directory
        run: mkdir -p release-assets

      - name: Download Windows EXE (if built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SyncWave-Windows-EXE
          path: release-assets/

      - name: Download Android APK (if built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SyncWave-Android-APK
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SyncWave Studio v1.0.${{ github.run_number }} (EXE & APK)
          body: |
            ## SyncWave Studio Downloads ⚡
            - **Windows**: `SyncWave-Setup.exe` (Windows desktop standalone installer)
            - **Android**: `app-debug.apk` (Android mobile APK)
            - Real-time synchronization active across devices using NVIDIA NIM API.
          files: |
            release-assets/**/*.exe
            release-assets/**/*.apk
