name: Build Windows EXE & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 1. BUILD WEB ASSETS (Fast, Platform-Independent on Linux)
  # ------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # ------------------------------------------------------------
  # 2. BUILD WINDOWS .EXE INSTALLER (Using Pre-built Web Assets)
  # ------------------------------------------------------------
  build-windows-exe:
    needs: build-web
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install Packaging Dependencies
        run: npm install --legacy-peer-deps

      - name: Package Windows EXE with Electron Builder
        run: npx electron-builder --win --config electron-builder.json

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-Windows-EXE
          path: dist-electron/*.exe
          if-no-files-found: warn

  # ------------------------------------------------------------
  # 3. BUILD ANDROID .APK PACKAGE (Using Pre-installed Android SDK)
  # ------------------------------------------------------------
  build-android-apk:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Capacitor & Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # ------------------------------------------------------------
  # 4. CREATE GITHUB RELEASE WITH DIRECT DOWNLOADS
  # ------------------------------------------------------------
  publish-release:
    needs: [build-windows-exe, build-android-apk]
    if: always() && (needs.build-windows-exe.result == 'success' || needs.build-android-apk.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Assets Directory
        run: mkdir -p release-assets

      - name: Download Windows EXE (if built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SyncWave-Windows-EXE
          path: release-assets/

      - name: Download Android APK (if built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SyncWave-Android-APK
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SyncWave Studio v1.0.${{ github.run_number }} (EXE & APK)
          body: |
            ## SyncWave Studio Binary Downloads ⚡
            - **Windows**: `SyncWave-Studio-Setup.exe` (Windows desktop standalone installer)
            - **Android**: `app-debug.apk` (Android mobile APK)
            - Real-time synchronization active across devices using NVIDIA NIM API.
          files: |
            release-assets/**/*.exe
            release-assets/**/*.apk
